<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Input Transaksi - CatatUang</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 font-['Plus_Jakarta_Sans',sans-serif] text-slate-800 antialiased">
    <!-- Component Containers -->
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <div class="main-wrapper">
        <!-- Main Content -->
        <main class="w-full pt-20 px-6 pb-12 bg-slate-50 min-h-screen">
            <div class="max-w-xl mx-auto">
                <form id="transactionForm" class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 flex flex-col gap-5">
                    
                    <!-- Tipe Transaksi Switcher -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Jenis Transaksi</label>
                        <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl gap-1">
                            <button class="flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-lg text-xs font-bold transition-all bg-emerald-600 text-white shadow-sm" id="btn-income" onclick="setTransactionType('income')" type="button">
                                <span class="material-symbols-outlined text-[18px]">arrow_downward</span>
                                <span>Pemasukan (+)</span>
                            </button>
                            <button class="flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-lg text-xs font-bold transition-all text-slate-500 hover:text-slate-800" id="btn-expense" onclick="setTransactionType('expense')" type="button">
                                <span class="material-symbols-outlined text-[18px]">arrow_upward</span>
                                <span>Pengeluaran (-)</span>
                            </button>
                        </div>
                    </div>

                    <!-- Nominal Input -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider" for="amount">Nominal (IDR)</label>
                        <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5">
                            <span class="text-xl font-bold text-slate-400 mr-2">Rp</span>
                            <input autocomplete="off" class="w-full bg-transparent border-none outline-none text-2xl font-bold text-slate-900 placeholder:text-slate-300" id="amount" oninput="formatAndCalculate(this)" placeholder="0" type="text" required>
                        </div>
                    </div>

                    <!-- Kategori -->
                    <div class="flex flex-col gap-1.5">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Kategori</label>
                            <span class="text-xs font-bold text-blue-600" id="selected-category-name">Gaji Utama</span>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2" id="category-grid">
                            <button class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-blue-600 text-white transition-all shadow-sm gap-1 text-xs font-semibold" onclick="selectCategory(this, 'Gaji Utama')" type="button">
                                <span class="material-symbols-outlined text-[20px]">payments</span>
                                <span>Gaji Utama</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold" onclick="selectCategory(this, 'Freelance')" type="button">
                                <span class="material-symbols-outlined text-[20px]">terminal</span>
                                <span>Freelance</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold" onclick="selectCategory(this, 'Investasi')" type="button">
                                <span class="material-symbols-outlined text-[20px]">trending_up</span>
                                <span>Investasi</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold" onclick="selectCategory(this, 'Lainnya')" type="button">
                                <span class="material-symbols-outlined text-[20px]">more_horiz</span>
                                <span>Lainnya</span>
                            </button>
                        </div>
                    </div>

                    <!-- Tanggal -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider" for="date">Tanggal Transaksi</label>
                        <input class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 outline-none" id="date" type="date">
                    </div>

                    <!-- Keterangan -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-400 uppercase tracking-wider" for="note">Keterangan / Catatan</label>
                        <input class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-xs text-slate-800 outline-none placeholder:text-slate-400" id="note" placeholder="Contoh: Pembayaran Honor Project" type="text">
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="flex items-center gap-2 pt-2">
                        <button class="flex-1 py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow-sm shadow-blue-600/20 transition-all" id="submit-btn" type="submit">
                            <span class="material-symbols-outlined text-[18px]">check_circle</span>
                            <span id="submit-label">Simpan ke Spreadsheet</span>
                        </button>
                        <button class="py-3 px-4 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold text-xs transition-all" onclick="resetForm()" type="button">
                            Reset
                        </button>
                    </div>

                    <!-- Notification Toast -->
                    <div class="hidden bg-emerald-600 text-white p-3.5 rounded-xl shadow-md items-center justify-between text-xs" id="toast-success">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-[18px]">verified</span>
                            <span class="font-bold">Transaksi berhasil dikirim ke Google Spreadsheet!</span>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Modal Profil Pengguna -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <h3 class="text-lg font-bold text-slate-900">Profil Pengguna</h3>
            <p class="mt-1 text-slate-500 text-xs">Username yang aktif untuk mencatat & melihat transaksi keuangan Anda.</p>
            <div class="form-group mt-4">
                <label for="userInput" class="text-xs font-bold text-slate-700 uppercase">Username Pengguna</label>
                <input type="text" id="userInput" class="form-control mt-1 text-sm bg-slate-100 text-slate-600 font-semibold cursor-not-allowed" readonly>
            </div>
            <div class="modal-actions mt-6 flex items-center justify-end">
                <button type="button" class="px-5 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-sm" onclick="closeModal()">Tutup</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function setTransactionType(type) {
            currentType = type === 'income' ? 'pemasukan' : 'pengeluaran';
            const btnIncome = document.getElementById('btn-income');
            const btnExpense = document.getElementById('btn-expense');
            const submitBtn = document.getElementById('submit-btn');

            if (type === 'income') {
                btnIncome.className = 'flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-lg text-xs font-bold transition-all bg-emerald-600 text-white shadow-sm';
                btnExpense.className = 'flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-lg text-xs font-bold transition-all text-slate-500 hover:text-slate-800';
                renderCategories(false);
            } else {
                btnExpense.className = 'flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-lg text-xs font-bold transition-all bg-rose-600 text-white shadow-sm';
                btnIncome.className = 'flex items-center justify-center gap-1.5 py-2.5 px-4 rounded-lg text-xs font-bold transition-all text-slate-500 hover:text-slate-800';
                renderCategories(true);
            }
        }

        function renderCategories(isExpense) {
            const grid = document.getElementById('category-grid');
            const nameEl = document.getElementById('selected-category-name');
            if (isExpense) {
                nameEl.innerText = 'Makanan';
                selectedCategory = 'Makanan';
                grid.innerHTML = `
                    <button type="button" onclick="selectCategory(this, 'Makanan')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-blue-600 text-white transition-all shadow-sm gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">restaurant</span>
                        <span>Makanan</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Transport')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">directions_car</span>
                        <span>Transport</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Belanja')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">shopping_cart</span>
                        <span>Belanja</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Tagihan')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">receipt</span>
                        <span>Tagihan</span>
                    </button>
                `;
            } else {
                nameEl.innerText = 'Gaji Utama';
                selectedCategory = 'Gaji Utama';
                grid.innerHTML = `
                    <button type="button" onclick="selectCategory(this, 'Gaji Utama')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-blue-600 text-white transition-all shadow-sm gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">payments</span>
                        <span>Gaji Utama</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Freelance')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">terminal</span>
                        <span>Freelance</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Investasi')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">trending_up</span>
                        <span>Investasi</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Lainnya')" class="category-btn flex flex-col items-center justify-center p-3 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition-all gap-1 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">more_horiz</span>
                        <span>Lainnya</span>
                    </button>
                `;
            }
        }
    </script>
</body>

</html>
