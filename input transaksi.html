<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Input Transaksi - DompetKu</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-50 font-['Plus_Jakarta_Sans',sans-serif] text-slate-800 antialiased">
    <!-- Component Containers -->
    <div id="sidebar-container"></div>
    <div id="header-container"></div>
    <div class="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <div class="main-wrapper">
        <!-- Main Content -->
        <main class="w-full pt-20 px-6 pb-12 bg-slate-50 min-h-screen">
            <div class="max-w-4xl mx-auto flex flex-col gap-6">

                <form id="transactionForm" class="flex flex-col gap-6">
                    
                    <!-- Row 1: Jenis Transaksi & Tanggal (2 Kolom di Desktop) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Jenis Transaksi Switcher -->
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">1. Jenis Transaksi</label>
                            <div class="relative flex p-1.5 bg-slate-200/70 rounded-xl border border-slate-200/80 select-none overflow-hidden h-[50px] items-center">
                                <!-- Animated Sliding Pill Indicator -->
                                <div id="type-slider" class="type-slider is-income"></div>

                                <button class="relative z-10 flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-bold transition-colors duration-200 text-white cursor-pointer h-full" id="btn-income" onclick="setTransactionType('income')" type="button">
                                    <span class="material-symbols-outlined text-[18px]">arrow_downward</span>
                                    <span>Pemasukan (+)</span>
                                </button>
                                <button class="relative z-10 flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-bold transition-colors duration-200 text-slate-500 hover:text-slate-800 cursor-pointer h-full" id="btn-expense" onclick="setTransactionType('expense')" type="button">
                                    <span class="material-symbols-outlined text-[18px]">arrow_upward</span>
                                    <span>Pengeluaran (-)</span>
                                </button>
                            </div>
                        </div>

                        <!-- Tanggal Transaksi -->
                        <div class="flex flex-col gap-1.5">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider" for="date">2. Tanggal Transaksi</label>
                            <div class="relative flex items-center h-[50px]">
                                <input class="w-full h-full bg-white border border-slate-200/80 rounded-xl px-4 text-xs font-semibold text-slate-800 outline-none hover:border-slate-300 focus:border-blue-500 transition-all shadow-xs" id="date" type="date">
                            </div>
                        </div>
                    </div>

                    <!-- Row 2: Nominal Input + Quick Amount Chips -->
                    <div class="flex flex-col gap-2.5 bg-white/70 p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-xs">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider" for="amount">3. Nominal (IDR)</label>
                            <span class="text-[11px] text-slate-400">Ketik angka atau klik nominal cepat</span>
                        </div>
                        
                        <div class="flex items-center bg-white border border-slate-200/80 rounded-xl px-4 py-3 shadow-xs focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/10 transition-all">
                            <span class="text-2xl font-bold text-slate-400 mr-3">Rp</span>
                            <input autocomplete="off" class="w-full bg-transparent border-none outline-none text-2xl sm:text-3xl font-bold text-slate-900 placeholder:text-slate-300" id="amount" oninput="formatAndCalculate(this)" placeholder="0" type="text" required>
                        </div>

                        <!-- Quick Nominal Chips -->
                        <div class="flex flex-wrap items-center gap-2 pt-1">
                            <span class="text-xs text-slate-400 font-medium mr-1">Nominal Cepat:</span>
                            <button type="button" onclick="setQuickAmount(10000)" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white hover:bg-blue-50 hover:text-blue-600 text-slate-600 border border-slate-200/80 shadow-xs transition-all cursor-pointer">+10rb</button>
                            <button type="button" onclick="setQuickAmount(20000)" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white hover:bg-blue-50 hover:text-blue-600 text-slate-600 border border-slate-200/80 shadow-xs transition-all cursor-pointer">+20rb</button>
                            <button type="button" onclick="setQuickAmount(50000)" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white hover:bg-blue-50 hover:text-blue-600 text-slate-600 border border-slate-200/80 shadow-xs transition-all cursor-pointer">+50rb</button>
                            <button type="button" onclick="setQuickAmount(100000)" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white hover:bg-blue-50 hover:text-blue-600 text-slate-600 border border-slate-200/80 shadow-xs transition-all cursor-pointer">+100rb</button>
                            <button type="button" onclick="setQuickAmount(500000)" class="px-3 py-1.5 text-xs font-semibold rounded-lg bg-white hover:bg-blue-50 hover:text-blue-600 text-slate-600 border border-slate-200/80 shadow-xs transition-all cursor-pointer">+500rb</button>
                        </div>
                    </div>

                    <!-- Row 3: Kategori -->
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center justify-between">
                            <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">4. Pilih Kategori</label>
                            <div id="category-badge" class="flex items-center gap-1.5 text-xs font-bold text-blue-600 bg-blue-50 px-3 py-1 rounded-lg border border-blue-200/60">
                                <span class="text-slate-400 font-normal">Kategori:</span>
                                <span id="selected-category-name">Kiriman Ortu</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5" id="category-grid">
                            <button class="category-btn is-active flex flex-col items-center justify-center p-3.5 rounded-xl bg-blue-500 border border-blue-500 text-white shadow-md shadow-blue-500/25 gap-1.5 text-xs font-semibold" onclick="selectCategory(this, 'Kiriman Ortu')" type="button">
                                <span class="material-symbols-outlined text-[20px]">family_restroom</span>
                                <span>Kiriman Ortu</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs transition-all gap-1.5 text-xs font-semibold" onclick="selectCategory(this, 'Gaji / Part-time')" type="button">
                                <span class="material-symbols-outlined text-[20px]">work</span>
                                <span>Gaji / Part-time</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs transition-all gap-1.5 text-xs font-semibold" onclick="selectCategory(this, 'Freelance / Jastip')" type="button">
                                <span class="material-symbols-outlined text-[20px]">storefront</span>
                                <span>Freelance / Jastip</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs transition-all gap-1.5 text-xs font-semibold" onclick="selectCategory(this, 'Beasiswa')" type="button">
                                <span class="material-symbols-outlined text-[20px]">school</span>
                                <span>Beasiswa</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs transition-all gap-1.5 text-xs font-semibold" onclick="selectCategory(this, 'Hadiah / THR')" type="button">
                                <span class="material-symbols-outlined text-[20px]">redeem</span>
                                <span>Hadiah / THR</span>
                            </button>
                            <button class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs transition-all gap-1.5 text-xs font-semibold" onclick="selectCategory(this, 'Lainnya')" type="button">
                                <span class="material-symbols-outlined text-[20px]">more_horiz</span>
                                <span>Lainnya</span>
                            </button>
                        </div>
                    </div>

                    <!-- Row 4: Keterangan / Catatan -->
                    <div class="flex flex-col gap-1.5">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider" for="note">5. Keterangan / Catatan (Opsional)</label>
                        <div class="flex items-center bg-white border border-slate-200/80 rounded-xl px-4 py-3 shadow-xs focus-within:border-blue-500 transition-all">
                            <span class="material-symbols-outlined text-slate-400 mr-2 text-[20px]">edit_note</span>
                            <input class="w-full bg-transparent border-none outline-none text-xs text-slate-800 placeholder:text-slate-400" id="note" placeholder="Contoh: Uang bulanan ortu / Makan warteg / Laundry" type="text">
                        </div>
                    </div>

                    <!-- Row 5: Action Buttons -->
                    <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-200/80">
                        <button class="py-3 px-5 rounded-xl bg-slate-200/70 hover:bg-slate-200 text-slate-700 font-semibold text-xs transition-all cursor-pointer" onclick="resetForm()" type="button">
                            Reset Form
                        </button>
                        <button class="py-3 px-8 rounded-xl bg-blue-500 hover:bg-blue-600 text-white font-bold text-xs flex items-center justify-center gap-2 shadow-sm shadow-blue-500/25 transition-all cursor-pointer" id="submit-btn" type="submit">
                            <span class="material-symbols-outlined text-[18px]">check_circle</span>
                            <span id="submit-label">Simpan ke Spreadsheet</span>
                        </button>
                    </div>

                    <!-- Notification Toast -->
                    <div class="hidden bg-emerald-600 text-white p-3.5 rounded-xl shadow-md items-center justify-between text-xs" id="toast-success">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-[18px]">verified</span>
                            <span class="font-bold">Transaksi berhasil dikirim ke Google Spreadsheet!</span>
                        </div>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Modal Profil Pengguna -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <h3 class="text-lg font-bold text-slate-900">Profil Pengguna</h3>
            <p class="mt-1 text-slate-500 text-xs">Username yang aktif untuk mencatat & melihat transaksi keuangan Anda.</p>
            <div class="form-group mt-4">
                <label for="userInput" class="text-xs font-bold text-slate-700 uppercase">Username Pengguna</label>
                <input type="text" id="userInput" class="form-control mt-1 text-sm bg-slate-100 text-slate-600 font-semibold cursor-not-allowed" readonly>
            </div>
            <div class="modal-actions mt-6 flex items-center justify-end">
                <button type="button" class="px-5 py-2 rounded-xl text-xs font-semibold bg-blue-600 text-white hover:bg-blue-700 shadow-sm" onclick="closeModal()">Tutup</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function setQuickAmount(val) {
            const input = document.getElementById('amount');
            if (input) {
                input.value = new Intl.NumberFormat('id-ID').format(val);
            }
        }

        function setTransactionType(type) {
            currentType = type === 'income' ? 'pemasukan' : 'pengeluaran';
            const slider = document.getElementById('type-slider');
            const btnIncome = document.getElementById('btn-income');
            const btnExpense = document.getElementById('btn-expense');

            if (type === 'income') {
                if (slider) slider.className = 'type-slider is-income';
                btnIncome.className = 'relative z-10 flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-bold transition-colors duration-200 text-white cursor-pointer h-full';
                btnExpense.className = 'relative z-10 flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-bold transition-colors duration-200 text-slate-500 hover:text-slate-800 cursor-pointer h-full';
                renderCategories(false);
            } else {
                if (slider) slider.className = 'type-slider is-expense';
                btnExpense.className = 'relative z-10 flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-bold transition-colors duration-200 text-white cursor-pointer h-full';
                btnIncome.className = 'relative z-10 flex-1 flex items-center justify-center gap-2 py-2 px-3 rounded-lg text-xs font-bold transition-colors duration-200 text-slate-500 hover:text-slate-800 cursor-pointer h-full';
                renderCategories(true);
            }
        }

        function renderCategories(isExpense) {
            const grid = document.getElementById('category-grid');
            const nameEl = document.getElementById('selected-category-name');
            const activeBg = 'bg-blue-500 shadow-blue-500/25 border-blue-500';

            if (isExpense) {
                nameEl.innerText = 'Makan & Minum';
                selectedCategory = 'Makan & Minum';
                grid.innerHTML = `
                    <button type="button" onclick="selectCategory(this, 'Makan & Minum')" class="category-btn is-active flex flex-col items-center justify-center p-3.5 rounded-xl ${activeBg} text-white shadow-md gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">restaurant</span>
                        <span>Makan & Minum</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Sewa Kost & Listrik')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">home</span>
                        <span>Sewa Kost & Listrik</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Kebutuhan Harian')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">local_laundry_service</span>
                        <span>Kebutuhan Harian</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Jajan & Nongkrong')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">local_cafe</span>
                        <span>Jajan & Nongkrong</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Bensin & Transport')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">two_wheeler</span>
                        <span>Bensin & Transport</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Kuliah & Lainnya')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">menu_book</span>
                        <span>Kuliah & Lainnya</span>
                    </button>
                `;
            } else {
                nameEl.innerText = 'Kiriman Ortu';
                selectedCategory = 'Kiriman Ortu';
                grid.innerHTML = `
                    <button type="button" onclick="selectCategory(this, 'Kiriman Ortu')" class="category-btn is-active flex flex-col items-center justify-center p-3.5 rounded-xl ${activeBg} text-white shadow-md gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">family_restroom</span>
                        <span>Kiriman Ortu</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Gaji / Part-time')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">work</span>
                        <span>Gaji / Part-time</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Freelance / Jastip')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">storefront</span>
                        <span>Freelance / Jastip</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Beasiswa')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">school</span>
                        <span>Beasiswa</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Hadiah / THR')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">redeem</span>
                        <span>Hadiah / THR</span>
                    </button>
                    <button type="button" onclick="selectCategory(this, 'Lainnya')" class="category-btn flex flex-col items-center justify-center p-3.5 rounded-xl bg-white hover:bg-slate-100/90 text-slate-600 border border-slate-200/80 shadow-xs gap-1.5 text-xs font-semibold">
                        <span class="material-symbols-outlined text-[20px]">more_horiz</span>
                        <span>Lainnya</span>
                    </button>
                `;
            }
        }
    </script>
</body>

</html>
